<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0b">
<title>Hype Audio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-card: #111113;
    --text-primary: #F4F1EA; --text-secondary: rgba(244,241,234,0.6); --text-tertiary: rgba(244,241,234,0.4);
    --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.16);
    --mindset: #8E7CF0; --iron: #E0332F; --faith: #C9A227; --carl: #E0812F; --danger: #ff8a8a;
    --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-serif: 'Instrument Serif', Georgia, serif;
    --font-mono: 'JetBrains Mono', ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; color: var(--text-secondary); font-family: var(--font);
    background: radial-gradient(ellipse 80% 60% at 75% 0%, rgba(224,51,47,0.07) 0%, #0a0a0b 60%) #0a0a0b;
  }
  body { min-height: 100vh; padding: max(28px, env(safe-area-inset-top)) 30px calc(120px + env(safe-area-inset-bottom)); position: relative; }
  .page { max-width: 640px; margin: 0 auto; position: relative; z-index: 1; }
  .page-bg {
    position: fixed; inset: 0; z-index: 0;
    background-size: cover; background-position: center;
  }
  .page-bg::after {
    content: ''; position: absolute; inset: 0;
    background: rgba(10,10,11,0.7);
  }
  .home-eyebrow { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--text-tertiary); margin: 0 0 6px; }
  .dash-title {
    margin: 0 0 26px; font-family: var(--font-serif); font-size: 38px; font-weight: 700; font-style: italic;
    background: linear-gradient(135deg, var(--iron) 0%, var(--mindset) 50%, var(--faith) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .back-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .back-btn {
    background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-primary);
    border-radius: 10px; width: 34px; height: 34px; font-size: 16px; cursor: pointer; flex-shrink: 0;
  }
  .view-title { margin: 0; font-family: var(--font-serif); font-size: 24px; font-style: italic; font-weight: 700; color: var(--text-primary); }

  /* ===== Home — tiles (comic-panel style) ===== */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 8px; }
  .tile {
    position: relative; overflow: hidden;
    border: 3px solid var(--border-strong); border-radius: 14px;
    min-height: 230px; cursor: pointer; text-align: left;
    background-color: var(--bg-card);
    box-shadow: 7px 7px 0 rgba(0,0,0,0.55);
    transition: transform .15s, box-shadow .15s;
  }
  .tile:hover { transform: translate(-2px, -2px); box-shadow: 9px 9px 0 rgba(0,0,0,0.55); }
  .tile-panels {
    position: absolute; inset: 0; z-index: 0; display: grid;
    grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 3px;
    background: #000;
  }
  .tile-panel { background-size: cover; background-position: center 20%; }
  .tile::before {
    content: ''; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg, rgba(10,10,11,0.05) 0%, rgba(10,10,11,0.5) 55%, rgba(10,10,11,0.94) 100%);
  }
  .tile::after {
    /* halftone-dot ink texture, comic print feel */
    content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background-image: radial-gradient(rgba(244,241,234,0.9) 1px, transparent 1.4px);
    background-size: 5px 5px; opacity: .05; mix-blend-mode: overlay;
  }
  .tile-content {
    position: relative; z-index: 3; height: 100%;
    display: flex; flex-direction: column; justify-content: space-between; gap: 14px; padding: 22px;
  }
  .tile-emoji { font-size: 34px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.7)); }
  .tile-name {
    font-family: var(--font); font-weight: 800; font-size: 27px; text-transform: uppercase; letter-spacing: .01em;
    color: var(--text-primary); text-shadow: 3px 3px 0 rgba(0,0,0,0.8);
    overflow-wrap: anywhere;
  }
  /* Mentality names (Scripture, Resilience, Discipline...) run longer than the
     short pillar names this size was tuned for -- shrink + allow mid-word
     wrap so a single long word never overflows the tile. */
  #subcat-tiles .tile-name { font-size: 21px; }
  .tile-footer { display: flex; align-items: center; justify-content: space-between; }
  .tile-count { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); }
  .tile-arrow { color: var(--text-tertiary); }

  /* ===== Section view ===== */
  .random-play {
    width: 100%; padding: 16px; margin-bottom: 22px; border: 0; border-radius: 14px;
    color: #0a0a0a; font-family: var(--font); font-weight: 700; font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .08s ease, filter .15s ease;
  }
  .random-play:active { transform: scale(.98); }
  .random-play:hover { filter: brightness(1.08); }

  .moment-row { display: flex; gap: 10px; margin-bottom: 22px; }
  .moment-btn {
    flex: 1; padding: 14px 8px; border: 1px solid var(--border-strong); border-radius: 12px;
    background: rgba(255,255,255,0.06); color: var(--text-primary); font-family: var(--font); font-weight: 700;
    font-size: 12px; letter-spacing: .04em; text-transform: uppercase; cursor: pointer;
    transition: transform .08s ease, filter .15s ease;
  }
  .moment-btn:active { transform: scale(.98); }
  .moment-btn:hover { filter: brightness(1.08); }
  .moment-btn.active { background: var(--text-primary); color: #0a0a0a; }

  .section-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-tertiary); margin: 0 0 10px; }

  details {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
    margin-bottom: 22px; overflow: hidden;
  }
  details summary { padding: 14px 16px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-tertiary);
    list-style: none; display: flex; align-items: center; gap: 6px; }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '+'; font-size: 15px; color: var(--text-tertiary); }
  details[open] summary::before { content: '−'; }
  details[open] summary { border-bottom: 1px solid var(--border); }
  form { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-tertiary); }
  input, select {
    width: 100%; padding: 11px 14px; background: rgba(0,0,0,0.28); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text-primary); font-family: inherit; font-size: 14px; outline: none;
  }
  input::placeholder { color: var(--text-tertiary); }
  input[type="file"] { color: var(--text-tertiary); padding: 8px; }
  form button[type="submit"] {
    margin-top: 4px; padding: 12px 20px; border: 0; border-radius: 12px;
    background: linear-gradient(135deg, #F0524E 0%, var(--iron) 100%);
    color: #0a0a0a; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .record-btn {
    padding: 12px 20px; border: 0; border-radius: 12px;
    background: linear-gradient(135deg, #F0524E 0%, var(--iron) 100%);
    color: #0a0a0a; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  }

  #clip-list { display: flex; flex-direction: column; }
  .clip {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .clip-info { min-width: 0; flex: 1; }
  .clip-thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
  .clip-title { font-weight: 600; font-size: 14px; color: var(--text-primary); }
  .clip-meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); margin-top: 3px; }
  .clip-quote { font-size: 12px; font-style: italic; color: var(--text-tertiary); margin-top: 4px; line-height: 1.4; }
  .clip-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; position: relative; }
  .clip-actions .play-btn {
    padding: 8px 12px; width: 44px; border-radius: 10px; border: 1px solid var(--border-strong); background: rgba(255,255,255,0.06);
    color: var(--text-primary); font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .clip-actions .play-btn:hover { background: rgba(255,255,255,0.1); }
  .clip-actions .play-btn.repeat-active { background: rgba(255,255,255,0.18); border-color: var(--text-primary); }
  .clip-actions .play-btn.favorite-active { background: rgba(255,193,7,0.18); border-color: rgba(255,193,7,0.4); }
  /* Delete lives inside this menu, not as its own visible icon — the whole
     point is it should never be a fat-finger accident: open the menu, then
     confirm() on top of that. */
  .menu-wrap { position: relative; }
  .menu-btn {
    padding: 6px; width: 30px; height: 30px; border-radius: 8px; border: 1px solid transparent; background: transparent;
    color: var(--text-tertiary); font-size: 16px; cursor: pointer; line-height: 1;
  }
  .menu-btn:hover, .menu-btn.open { color: var(--text-primary); background: rgba(255,255,255,0.06); }
  .menu-dropdown {
    display: none; position: absolute; top: 100%; right: 0; margin-top: 4px; z-index: 10;
    background: #1a1a1d; border: 1px solid var(--border-strong); border-radius: 10px;
    box-shadow: 0 12px 28px rgba(0,0,0,0.5); min-width: 120px; overflow: hidden;
  }
  .menu-dropdown.open { display: block; }
  .menu-item {
    width: 100%; padding: 10px 14px; background: transparent; border: 0; text-align: left;
    color: var(--danger); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .menu-item:hover { background: rgba(255,138,138,0.1); }
  .menu-item.menu-item-neutral { color: var(--text-primary); }
  .menu-item.menu-item-neutral:hover { background: rgba(255,255,255,0.06); }
  .empty-state { color: var(--text-tertiary); font-size: 13px; text-align: center; padding: 28px 0; }

  /* ===== Bottom tab bar (Row's gym-tabbar pattern) ===== */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 10px max(16px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: linear-gradient(180deg, rgba(10,10,11,0) 0%, rgba(10,10,11,0.85) 40%, rgba(10,10,11,0.97) 100%);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    pointer-events: none;
  }
  .nowplaying {
    pointer-events: auto;
    display: flex; flex-direction: column; gap: 4px;
    width: 100%; max-width: 460px; padding: 9px 12px;
    background: rgba(20,20,22,0.85);
    border: 1px solid var(--border-strong); border-radius: 14px;
    box-shadow: 0 12px 36px rgba(0,0,0,0.55);
  }
  .nowplaying-row { display: flex; align-items: center; gap: 10px; }
  .nowplaying-title {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 13px; font-weight: 600; color: var(--text-primary);
  }
  .nowplaying-btn {
    flex-shrink: 0; padding: 7px 12px; border-radius: 10px;
    border: 1px solid var(--border-strong); background: rgba(255,255,255,0.06);
    color: var(--text-primary); font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .nowplaying-btn:hover { background: rgba(255,255,255,0.1); }
  .nowplaying-explain {
    display: flex; align-items: center; gap: 6px; padding-left: 2px;
  }
  .nowplaying-explain-text {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 11px; color: var(--text-tertiary);
  }
  .nowplaying-feedback-btn {
    flex-shrink: 0; padding: 2px 6px; border-radius: 8px; border: 1px solid transparent;
    background: transparent; font-size: 13px; line-height: 1; cursor: pointer; opacity: 0.6;
  }
  .nowplaying-feedback-btn:hover { opacity: 1; background: rgba(255,255,255,0.08); }
  .nowplaying-feedback-btn.active { opacity: 1; border-color: var(--border-strong); background: rgba(255,255,255,0.1); }
  .tabbar-inner {
    pointer-events: auto;
    display: flex; width: 100%; max-width: 460px; gap: 4px;
    padding: 6px; background: rgba(20,20,22,0.75);
    border: 1px solid var(--border); border-radius: 18px;
    box-shadow: 0 12px 36px rgba(0,0,0,0.55);
  }
  .tab {
    flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    padding: 9px 4px; border-radius: 13px; font-size: 10px; font-weight: 600; letter-spacing: .02em;
    color: var(--text-tertiary); background: transparent; border: 1px solid transparent; cursor: pointer;
  }
  .tab .tab-emoji { font-size: 16px; }
  .tab.active { color: var(--text-primary); background: rgba(255,255,255,0.07); border-color: var(--border-strong); }
</style>
</head>
<body>
<div class="page-bg" id="page-bg"></div>
<div class="page">

  <div id="view-home">
    <div class="home-eyebrow">Mental Armory</div>
    <h1 class="dash-title">Hype Audio</h1>
    <div id="sync-status-indicator" style="font-size:11px; color:var(--text-secondary); margin:-8px 0 12px;"></div>
    <input type="search" id="global-search-input" placeholder="Search everything you've said..." style="width: 100%; margin-bottom: 16px; box-sizing: border-box;">
    <div id="global-search-results" style="display:none"></div>
    <button id="title-review-link" onclick="showTitleReview()" style="display:none; width:100%; margin-bottom:16px; padding:10px; border-radius:10px; border:1px solid rgba(255,193,7,0.3); background:rgba(255,193,7,0.08); color:#FFC107; font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;"></button>
    <button id="content-ideas-link" onclick="showContentIdeas()" style="display:none; width:100%; margin-bottom:16px; padding:10px; border-radius:10px; border:1px solid rgba(255,193,7,0.3); background:rgba(255,193,7,0.08); color:#FFC107; font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;"></button>
    <button onclick="showWeeklyRecap()" style="width:100%; margin-bottom:16px; padding:10px; border-radius:10px; border:1px solid var(--border-strong); background:rgba(255,255,255,0.05); color:var(--text-primary); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;">📊 What Moved You This Week</button>
    <div class="tiles" id="tiles"></div>
    <div class="moment-row" id="moment-row"></div>
    <div class="moment-row" id="state-mode-row"></div>
  </div>

  <div id="view-subcat" style="display:none; padding: 0 10px">
    <div class="back-row">
      <button class="back-btn" id="subcat-back-btn" type="button">←</button>
      <h1 class="view-title" id="subcat-title"></h1>
    </div>

    <button class="random-play" id="subcat-random-play" type="button"></button>

    <details>
      <summary>Upload a clip (new or existing mentality)</summary>
      <form id="sc-upload-form">
        <input type="file" id="sc-file-input" accept="audio/*" required>
        <div class="field"><label>Title</label><input type="text" id="sc-title-input" placeholder="Title" required></div>
        <div class="field"><label>Mentality</label><input type="text" id="sc-mentality-input" placeholder="e.g. goggins, dorian, carl" required></div>
        <select id="sc-moment-input">
          <option value="pre_workout">Pre-workout</option>
          <option value="mid_set">Mid-set</option>
          <option value="post_workout">Post-workout</option>
        </select>
        <select id="sc-source-input">
          <option value="original">Original</option>
          <option value="licensed">Licensed</option>
          <option value="personal_use">Personal use only</option>
        </select>
        <button type="submit">Upload</button>
      </form>
    </details>

    <div class="tiles" id="subcat-tiles"></div>
  </div>

  <div id="view-section" style="display:none; padding: 0 10px">
    <div class="back-row">
      <button class="back-btn" id="back-btn" type="button">←</button>
      <h1 class="view-title" id="section-title"></h1>
    </div>

    <button class="random-play" id="random-play" type="button"></button>
    <button class="random-play favorites-play" id="favorites-play" type="button"></button>

    <details>
      <summary>Upload a clip</summary>
      <form id="upload-form">
        <input type="file" id="file-input" accept="audio/*" required>
        <div class="field"><label>Title</label><input type="text" id="title-input" placeholder="Title" required></div>
        <div class="field"><label>Mentality</label><input type="text" id="mentality-input" placeholder="e.g. goggins, dorian, carl" required></div>
        <select id="pillar-input" required>
          <option value="mindset">Mindset</option>
          <option value="iron">Iron</option>
          <option value="faith">Faith</option>
          <option value="carl">Carl</option>
        </select>
        <select id="moment-input">
          <option value="pre_workout">Pre-workout</option>
          <option value="mid_set">Mid-set</option>
          <option value="post_workout">Post-workout</option>
        </select>
        <select id="source-input">
          <option value="original">Original</option>
          <option value="licensed">Licensed</option>
          <option value="personal_use">Personal use only</option>
        </select>
        <button type="submit">Upload</button>
      </form>
    </details>

    <details id="record-clip-details" style="display:none">
      <summary>Record a clip</summary>
      <div id="record-idle" style="padding: 14px 16px 16px">
        <button type="button" class="record-btn" id="record-start-btn">🎙️ Record</button>
      </div>
      <div id="record-active" style="display:none; padding: 14px 16px 16px; align-items: center; gap: 10px;">
        <span id="record-elapsed" style="font-family: var(--font-mono); font-size: 13px; color: var(--text-tertiary);">0:00</span>
        <button type="button" class="record-btn" id="record-stop-btn">⏹ Stop</button>
      </div>
      <div id="record-preview" style="display:none; padding: 14px 16px 16px; flex-direction: column; gap: 10px;">
        <audio controls id="record-preview-audio" style="width: 100%"></audio>
        <button type="button" class="record-btn" id="record-rerecord-btn">🔁 Re-record</button>
      </div>
      <form id="record-save-form" style="display:none">
        <div class="field"><label>Title</label><input type="text" id="record-title-input" placeholder="Title" required></div>
        <div class="field"><label>Mentality</label><input type="text" id="record-mentality-input" placeholder="e.g. drive, discipline" required></div>
        <select id="record-moment-input">
          <option value="pre_workout">Pre-workout</option>
          <option value="mid_set">Mid-set</option>
          <option value="post_workout">Post-workout</option>
        </select>
        <select id="record-source-input">
          <option value="personal_use" selected>Personal use only</option>
          <option value="original">Original</option>
          <option value="licensed">Licensed</option>
        </select>
        <button type="submit">Save</button>
      </form>
    </details>

    <div class="section-label">Library</div>
    <div id="clip-list"></div>
  </div>

  <div id="view-title-review" style="display:none; padding: 0 10px">
    <div class="back-row">
      <button class="back-btn" id="title-review-back-btn" type="button">←</button>
      <h1 class="view-title">Review Suggested Titles</h1>
    </div>
    <div id="title-review-list"></div>
  </div>

  <div id="view-content-ideas" style="display:none; padding: 0 10px">
    <div class="back-row">
      <button class="back-btn" id="content-ideas-back-btn" type="button">←</button>
      <h1 class="view-title">Content Ideas</h1>
    </div>
    <div id="content-ideas-list"></div>
  </div>

  <div id="view-weekly-recap" style="display:none; padding: 0 10px">
    <div class="back-row">
      <button class="back-btn" id="weekly-recap-back-btn" type="button">←</button>
      <h1 class="view-title">Weekly Recap</h1>
    </div>
    <pre id="weekly-recap-text" style="white-space: pre-wrap; word-wrap: break-word; font-family: inherit; font-size: 14px; line-height: 1.6; color: var(--text-primary);"></pre>
    <button id="weekly-recap-play-suggested" type="button" class="random-play" style="display:none"></button>
  </div>

</div>

  <nav class="tabbar">
    <div class="nowplaying" id="nowplaying" style="display:none">
      <div class="nowplaying-row">
        <span class="nowplaying-title" id="nowplaying-title"></span>
        <button class="nowplaying-btn" id="nowplaying-toggle" type="button">⏸</button>
        <button class="nowplaying-btn" id="nowplaying-stop" type="button">■</button>
      </div>
      <div class="nowplaying-explain">
        <span class="nowplaying-explain-text" id="nowplaying-explain-text"></span>
        <button class="nowplaying-feedback-btn" id="nowplaying-thumbs-up" type="button" title="More like this">👍</button>
        <button class="nowplaying-feedback-btn" id="nowplaying-thumbs-down" type="button" title="Less like this">👎</button>
      </div>
    </div>
    <div class="tabbar-inner" id="tabbar-inner"></div>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="sync.js"></script>
  <script src="hype-audio.js"></script>
  <script src="weekly-recap.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
  <script>
    // No Supabase client here -- sync.js owns the only one this page needs,
    // and it already guards `!window.supabase`. Creating a second client at
    // top level was dead code AND the reason the app hard-crashed offline:
    // the CDN script fails to load, window.supabase is undefined, the whole
    // inline script dies at the constructor call before showHome() ever ran.
    const PILLARS = {
      mindset: { label: 'Mindset', emoji: '🧠', color: 'var(--mindset)' },
      iron:    { label: 'Iron',    emoji: '🔥', color: 'var(--iron)' },
      faith:   { label: 'Faith',   emoji: '✝️', color: 'var(--faith)' },
      carl:    { label: 'Carl',    emoji: '🎙️', color: 'var(--carl)' },
    };
    const PILLAR_ORDER = ['mindset', 'iron', 'faith', 'carl'];
    // carl's home-tile images are real photos saved as .jpg; the rest are
    // ChatGPT-generated .png -- mismatched extension/content-type silently
    // fails to decode on iOS Safari, so this has to be exact per pillar.
    function heroImgExt(key) { return key === 'carl' ? 'jpg' : 'png'; }

    // Cached in a module-level var (not re-fetched per render) — the manifest
    // never changes during a session. Starts with just a `default` entry so
    // renderSection() has something safe to fall back to before the fetch
    // resolves; re-renders the current section once the real manifest lands.
    let CLIP_ART_MANIFEST = { default: 'default.png' };
    fetch('images/clip-art-manifest.json')
      .then(function (r) { return r.json(); })
      .then(function (manifest) {
        CLIP_ART_MANIFEST = manifest;
        if (currentMentality) renderSection(currentPillar, currentMentality);
        else if (currentPillar) renderSubcats(currentPillar);
      })
      .catch(function () {});

    // Cloud sync for the hype_audio localStorage key — this is what
    // makes Row's mini-player and this app share the same library.
    window.initCloudSync({
      appKey: 'hype-audio',
      syncedKeys: ['hype_audio', 'hype_audio_events'],
      onApplied: function () {
        HypeAudio.migrateMentalityCasing();
        HypeAudio.migrateGogginsToMindset();
        HypeAudio.migrateCarlToOwnPillar();
        renderHome();
        if (currentMentality) renderSection(currentPillar, currentMentality);
        else if (currentPillar) renderSubcats(currentPillar);
      },
      onStatusChange: function (status, lastSyncedAt) {
        const el = document.getElementById('sync-status-indicator');
        if (!el) return;
        const labels = { synced: 'Synced', saving: 'Saving…', retrying: 'Retrying…', offline: 'Offline' };
        let text = labels[status] || status;
        if (status === 'synced' && lastSyncedAt) {
          const secs = Math.max(0, Math.round((Date.now() - lastSyncedAt) / 1000));
          const ago = secs < 60 ? secs + 's ago' : Math.round(secs / 60) + 'm ago';
          text += ' (' + ago + ')';
        }
        el.textContent = text;
      },
    });

    let currentPillar = null;   // null = home, else a pillar key
    let currentMentality = null; // null = subcat screen, else inside a mentality's clip list

    function mentalityLabel(m) { return m.charAt(0).toUpperCase() + m.slice(1); }
    function mentalityArt(m) { return 'images/clips/' + (Object.hasOwn(CLIP_ART_MANIFEST, m) ? CLIP_ART_MANIFEST[m] : CLIP_ART_MANIFEST.default); }
    HypeAudio.setArtworkResolver(mentalityArt);

    function renderHome() {
      const pendingCount = HypeAudio.listActiveClips().filter(function (c) {
        return typeof c.suggested_title === 'string' && c.suggested_title.trim() &&
          c.suggested_title.trim() !== (c.title || '').trim();
      }).length;
      const reviewLink = document.getElementById('title-review-link');
      if (pendingCount > 0) {
        reviewLink.style.display = '';
        reviewLink.textContent = 'Review ' + pendingCount + ' suggested title' + (pendingCount === 1 ? '' : 's') + ' →';
      } else {
        reviewLink.style.display = 'none';
      }

      const contentIdeasCount = HypeAudio.listActiveClips().filter(HypeAudio.hasPendingContentIdea).length;
      const contentIdeasLink = document.getElementById('content-ideas-link');
      if (contentIdeasCount > 0) {
        contentIdeasLink.style.display = '';
        contentIdeasLink.textContent = contentIdeasCount + ' rant' + (contentIdeasCount === 1 ? '' : 's') + ' ready for content →';
      } else {
        contentIdeasLink.style.display = 'none';
      }

      const tiles = document.getElementById('tiles');
      tiles.innerHTML = '';
      PILLAR_ORDER.forEach(function (key) {
        const meta = PILLARS[key];
        const count = HypeAudio.listActiveClips().filter(function (c) { return c.pillar === key; }).length;
        const tile = document.createElement('button');
        tile.className = 'tile';
        tile.type = 'button';
        tile.style.borderColor = meta.color;
        tile.innerHTML =
          '<div class="tile-panels" id="panels-' + key + '"></div>' +
          '<div class="tile-content">' +
            '<div class="tile-emoji">' + meta.emoji + '</div>' +
            '<div>' +
              '<div class="tile-name" style="color:' + meta.color + '">' + meta.label + '</div>' +
              '<div class="tile-footer">' +
                '<span class="tile-count">' + count + ' clip' + (count === 1 ? '' : 's') + '</span>' +
                '<span class="tile-arrow">→</span>' +
              '</div>' +
            '</div>' +
          '</div>';
        const panels = tile.querySelector('.tile-panels');
        // Carl's tile is a real face, not a mood shot -- splitting it into
        // 4 tiny quarter-panels leaves nothing recognizable at real tile
        // size. One full photo instead; the other pillars keep the grid.
        const panelCount = key === 'carl' ? 1 : 4;
        for (let n = 1; n <= panelCount; n++) {
          const cell = document.createElement('div');
          cell.className = 'tile-panel';
          if (panelCount === 1) { cell.style.gridColumn = '1 / -1'; cell.style.gridRow = '1 / -1'; }
          cell.style.backgroundImage = 'linear-gradient(160deg, rgba(255,255,255,0.06), #0a0a0b 70%)';
          const img = new Image();
          img.onload = function () { cell.style.backgroundImage = "url('" + img.src + "')"; };
          img.src = 'images/home/' + key + '-' + n + '.' + heroImgExt(key);
          panels.appendChild(cell);
        }
        tile.onclick = function () { showSubcats(key); };
        tiles.appendChild(tile);
      });

      const MOMENTS = [
        { key: 'pre_workout', label: 'Pre' },
        { key: 'mid_set', label: 'Mid-Set' },
        { key: 'post_workout', label: 'Post' },
      ];
      const momentRow = document.getElementById('moment-row');
      momentRow.innerHTML = '';
      MOMENTS.forEach(function (m) {
        const active = HypeAudio.isPlayingMoment(m.key);
        const btn = document.createElement('button');
        btn.className = 'moment-btn' + (active ? ' active' : '');
        btn.type = 'button';
        btn.textContent = active ? '■ STOP' : m.label;
        btn.onclick = function () {
          if (HypeAudio.isPlayingMoment(m.key)) { HypeAudio.stopPlayback(); renderHome(); return; }
          const clip = HypeAudio.playRandomLoop({ moment: m.key });
          if (!clip) { alert('No ' + m.label.toLowerCase() + ' clips yet.'); return; }
          renderHome();
        };
        momentRow.appendChild(btn);
      });

      const STATE_MODES_UI = [
        { key: 'heavy_day', label: 'Heavy Day' },
        { key: 'need_discipline', label: 'Need Discipline' },
        { key: 'post_failure_reset', label: 'Post-Failure Reset' },
        { key: 'locked_in', label: 'Locked In' },
      ];
      const stateModeRow = document.getElementById('state-mode-row');
      stateModeRow.innerHTML = '';
      STATE_MODES_UI.forEach(function (m) {
        const active = HypeAudio.isPlayingRandomFilter({ stateMode: m.key });
        const btn = document.createElement('button');
        btn.className = 'moment-btn' + (active ? ' active' : '');
        btn.type = 'button';
        btn.textContent = active ? '■ STOP' : m.label;
        btn.onclick = function () {
          if (HypeAudio.isPlayingRandomFilter({ stateMode: m.key })) { HypeAudio.stopPlayback(); renderHome(); return; }
          const clip = HypeAudio.playRandomLoop({ stateMode: m.key });
          if (!clip) { alert('No ' + m.label.toLowerCase() + ' clips yet.'); return; }
          renderHome();
        };
        stateModeRow.appendChild(btn);
      });
    }

    function renderSubcats(key) {
      const meta = PILLARS[key];
      document.getElementById('subcat-title').textContent = meta.label;
      document.getElementById('subcat-title').style.color = meta.color;
      document.getElementById('page-bg').style.backgroundImage = "url('images/home/" + key + "-1." + heroImgExt(key) + "')";

      const randomBtn = document.getElementById('subcat-random-play');
      const randomActive = HypeAudio.isPlayingRandomFilter({ pillar: key });
      randomBtn.textContent = randomActive ? '■ STOP' : meta.emoji + ' PLAY RANDOM';
      randomBtn.style.background = randomActive ? 'rgba(255,255,255,0.1)' : 'linear-gradient(135deg, ' + meta.color + ' 0%, ' + meta.color + ' 100%)';
      randomBtn.onclick = function () {
        if (HypeAudio.isPlayingRandomFilter({ pillar: key })) { HypeAudio.stopPlayback(); renderSubcats(key); return; }
        const clip = HypeAudio.playRandomLoop({ pillar: key });
        if (!clip) { alert('No ' + meta.label.toLowerCase() + ' clips yet — upload one in a subcategory.'); return; }
        renderSubcats(key);
      };

      const tiles = document.getElementById('subcat-tiles');
      tiles.innerHTML = '';
      const clips = HypeAudio.listActiveClips().filter(function (c) { return c.pillar === key; });
      const counts = {};
      clips.forEach(function (c) { counts[c.mentality] = (counts[c.mentality] || 0) + 1; });
      const mentalities = Object.keys(counts).sort();
      if (!mentalities.length) {
        tiles.innerHTML = '<div class="empty-state">No ' + meta.label.toLowerCase() + ' clips yet — upload one above.</div>';
        return;
      }
      mentalities.forEach(function (m) {
        const tile = document.createElement('button');
        tile.className = 'tile';
        tile.type = 'button';
        tile.style.borderColor = meta.color;
        tile.innerHTML =
          '<div class="tile-panels"><div class="tile-panel" style="grid-column:1/-1;grid-row:1/-1;background-image:url(\'' + mentalityArt(m) + '\')"></div></div>' +
          '<div class="tile-content">' +
            '<div>' +
              '<div class="tile-name" style="color:' + meta.color + '">' + escapeHtml(mentalityLabel(m)) + '</div>' +
              '<div class="tile-footer">' +
                '<span class="tile-count">' + counts[m] + ' clip' + (counts[m] === 1 ? '' : 's') + '</span>' +
                '<span class="tile-arrow">→</span>' +
              '</div>' +
            '</div>' +
          '</div>';
        tile.onclick = function () { showSection(key, m); };
        tiles.appendChild(tile);
      });
    }

    function renderTabbar() {
      const inner = document.getElementById('tabbar-inner');
      inner.innerHTML = '';
      const homeTab = document.createElement('button');
      homeTab.className = 'tab' + (currentPillar === null ? ' active' : '');
      homeTab.type = 'button';
      homeTab.innerHTML = '<span class="tab-emoji">🏠</span>Home';
      homeTab.onclick = function () { showHome(); };
      inner.appendChild(homeTab);
      PILLAR_ORDER.forEach(function (key) {
        const meta = PILLARS[key];
        const tab = document.createElement('button');
        tab.className = 'tab' + (currentPillar === key ? ' active' : '');
        tab.type = 'button';
        tab.innerHTML = '<span class="tab-emoji">' + meta.emoji + '</span>' + meta.label;
        tab.onclick = function () { showSubcats(key); };
        inner.appendChild(tab);
      });
    }

    function showHome() {
      if (typeof mediaRecorder !== 'undefined' && mediaRecorder && mediaRecorder.state === 'recording') cancelRecording();
      currentPillar = null;
      currentMentality = null;
      document.getElementById('view-home').style.display = '';
      document.getElementById('view-subcat').style.display = 'none';
      document.getElementById('view-section').style.display = 'none';
      document.getElementById('view-title-review').style.display = 'none';
      document.getElementById('view-content-ideas').style.display = 'none';
      document.getElementById('view-weekly-recap').style.display = 'none';
      document.getElementById('page-bg').style.backgroundImage = "url('images/home/hero-combo.png')";
      // Codex review caught this: a search result's own state (input value,
      // results shown, tiles/moment-row hidden) survived navigating back
      // here otherwise, leaving Home stuck showing stale search results.
      document.getElementById('global-search-input').value = '';
      document.getElementById('global-search-results').style.display = 'none';
      document.getElementById('tiles').style.display = '';
      document.getElementById('moment-row').style.display = '';
      renderHome();
      renderTabbar();
    }

    function showSubcats(key) {
      if (typeof mediaRecorder !== 'undefined' && mediaRecorder && mediaRecorder.state === 'recording') cancelRecording();
      currentPillar = key;
      currentMentality = null;
      document.getElementById('view-home').style.display = 'none';
      document.getElementById('view-subcat').style.display = '';
      document.getElementById('view-section').style.display = 'none';
      document.getElementById('view-title-review').style.display = 'none';
      document.getElementById('view-content-ideas').style.display = 'none';
      document.getElementById('view-weekly-recap').style.display = 'none';
      renderSubcats(key);
      renderTabbar();
    }

    function showTitleReview() {
      if (typeof mediaRecorder !== 'undefined' && mediaRecorder && mediaRecorder.state === 'recording') cancelRecording();
      // Codex review caught this: without resetting currentPillar/mentality
      // and re-rendering the tab bar, opening review from inside a section
      // left that pillar's tab still highlighted while review was showing.
      currentPillar = null;
      currentMentality = null;
      document.getElementById('view-home').style.display = 'none';
      document.getElementById('view-subcat').style.display = 'none';
      document.getElementById('view-section').style.display = 'none';
      document.getElementById('view-title-review').style.display = '';
      document.getElementById('view-content-ideas').style.display = 'none';
      document.getElementById('view-weekly-recap').style.display = 'none';
      renderTitleReview();
      renderTabbar();
    }

    function renderTitleReview() {
      const list = document.getElementById('title-review-list');
      const pending = HypeAudio.listActiveClips().filter(function (c) {
        return typeof c.suggested_title === 'string' && c.suggested_title.trim() &&
          c.suggested_title.trim() !== (c.title || '').trim();
      });
      list.innerHTML = pending.length ? '' : '<div class="empty-state">No pending title suggestions.</div>';
      pending.forEach(function (clip) {
        const row = document.createElement('div');
        row.className = 'clip';
        row.innerHTML =
          '<div class="clip-info">' +
            '<div class="clip-meta">Current: ' + escapeHtml(clip.title) + '</div>' +
            '<div class="clip-title">Suggested: ' + escapeHtml(clip.suggested_title) + '</div>' +
          '</div>';
        const actions = document.createElement('div');
        actions.className = 'clip-actions';
        const applyBtn = document.createElement('button');
        applyBtn.className = 'play-btn';
        applyBtn.textContent = '✓ Apply';
        applyBtn.onclick = function () {
          HypeAudio.updateClip(clip.id, { title: clip.suggested_title, suggested_title: null });
          renderTitleReview();
        };
        const dismissBtn = document.createElement('button');
        dismissBtn.className = 'play-btn';
        dismissBtn.textContent = '✕ Dismiss';
        dismissBtn.onclick = function () {
          HypeAudio.updateClip(clip.id, { suggested_title: null });
          renderTitleReview();
        };
        actions.appendChild(applyBtn);
        actions.appendChild(dismissBtn);
        row.appendChild(actions);
        list.appendChild(row);
      });
    }

    function showContentIdeas() {
      if (typeof mediaRecorder !== 'undefined' && mediaRecorder && mediaRecorder.state === 'recording') cancelRecording();
      currentPillar = null;
      currentMentality = null;
      document.getElementById('view-home').style.display = 'none';
      document.getElementById('view-subcat').style.display = 'none';
      document.getElementById('view-section').style.display = 'none';
      document.getElementById('view-title-review').style.display = 'none';
      document.getElementById('view-content-ideas').style.display = '';
      document.getElementById('view-weekly-recap').style.display = 'none';
      renderContentIdeas();
      renderTabbar();
    }

    // Item 14: "What moved you" weekly recap -- deterministic, local-only
    // math (see weekly-recap.js) over hype-clip events, joined against real
    // Row training-day dates fetched via hypeFetchRowWorkoutDates() (sync.js
    // -- session dates only, least-privilege Postgrest JSON path read of
    // Row's po-coach app_state row). If the fetch fails or returns nothing
    // (offline, Supabase not configured, no logged sessions), workoutDates
    // stays empty and the recap's own no-workout-data path (tested in
    // weekly-recap.selfcheck.js) renders instead of a fake join.
    function showWeeklyRecap() {
      if (typeof mediaRecorder !== 'undefined' && mediaRecorder && mediaRecorder.state === 'recording') cancelRecording();
      currentPillar = null;
      currentMentality = null;
      document.getElementById('view-home').style.display = 'none';
      document.getElementById('view-subcat').style.display = 'none';
      document.getElementById('view-section').style.display = 'none';
      document.getElementById('view-title-review').style.display = 'none';
      document.getElementById('view-content-ideas').style.display = 'none';
      document.getElementById('view-weekly-recap').style.display = '';
      renderWeeklyRecap();
      renderTabbar();
    }

    async function renderWeeklyRecap() {
      let workoutDates = [];
      try {
        if (typeof window.hypeFetchRowWorkoutDates === 'function') {
          workoutDates = Array.from(await window.hypeFetchRowWorkoutDates());
        }
      } catch (e) { workoutDates = []; }
      const recap = WeeklyRecap.buildWeeklyRecap({ workoutDates: workoutDates });
      document.getElementById('weekly-recap-text').textContent = recap.markdown;
      const playBtn = document.getElementById('weekly-recap-play-suggested');
      if (recap.suggestedQueue) {
        playBtn.style.display = '';
        playBtn.textContent = '▶ Play ' + mentalityLabel(recap.suggestedQueue.mentality) + ' Queue';
        playBtn.onclick = function () {
          const clip = HypeAudio.playRandomLoop({ mentality: recap.suggestedQueue.mentality });
          if (!clip) { alert('No clips left in that mentality.'); return; }
          showHome();
        };
      } else {
        playBtn.style.display = 'none';
      }
    }
    document.getElementById('weekly-recap-back-btn').onclick = function () { showHome(); };

    const CONTENT_IDEA_PILLARS = ['mindset', 'training', 'life', 'faith', 'diet'];

    function renderContentIdeas() {
      const list = document.getElementById('content-ideas-list');
      const pending = HypeAudio.listActiveClips().filter(HypeAudio.hasPendingContentIdea);
      list.innerHTML = pending.length ? '' : '<div class="empty-state">No rants ready for content yet.</div>';
      pending.forEach(function (clip) {
        const row = document.createElement('div');
        row.className = 'clip';
        row.style.flexDirection = 'column';
        row.style.alignItems = 'stretch';

        const preview = document.createElement('div');
        preview.className = 'clip-quote';
        preview.textContent = '"' + (HypeAudio.quotePreview(clip, 200) || '') + '"';
        row.appendChild(preview);

        const titleField = document.createElement('div');
        titleField.className = 'field';
        titleField.innerHTML = '<label>Title</label>';
        const titleInput = document.createElement('input');
        titleInput.type = 'text';
        titleInput.value = clip.title || '';
        titleField.appendChild(titleInput);
        row.appendChild(titleField);

        const hookField = document.createElement('div');
        hookField.className = 'field';
        hookField.innerHTML = '<label>Hook</label>';
        const hookInput = document.createElement('input');
        hookInput.type = 'text';
        hookInput.placeholder = 'The line that stops the scroll';
        hookField.appendChild(hookInput);
        row.appendChild(hookField);

        const pillarField = document.createElement('div');
        pillarField.className = 'field';
        pillarField.innerHTML = '<label>Pillar</label>';
        const pillarSelect = document.createElement('select');
        CONTENT_IDEA_PILLARS.forEach(function (p) {
          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = p.charAt(0).toUpperCase() + p.slice(1);
          if (p === 'mindset') opt.selected = true;
          pillarSelect.appendChild(opt);
        });
        pillarField.appendChild(pillarSelect);
        row.appendChild(pillarField);

        const sendBtn = document.createElement('button');
        sendBtn.type = 'button';
        sendBtn.textContent = 'Send to Content Ideas';
        sendBtn.style.marginTop = '10px';
        sendBtn.style.padding = '10px';
        sendBtn.style.border = '0';
        sendBtn.style.borderRadius = '10px';
        sendBtn.style.background = 'linear-gradient(135deg, #F0524E 0%, var(--iron) 100%)';
        sendBtn.style.color = '#0a0a0a';
        sendBtn.style.fontFamily = 'inherit';
        sendBtn.style.fontWeight = '700';
        sendBtn.style.cursor = 'pointer';
        sendBtn.onclick = async function () {
          sendBtn.disabled = true;
          const prevLabel = sendBtn.textContent;
          sendBtn.textContent = 'Sending…';
          try {
            const result = await HypeAudio.sendToContentIdea(clip, {
              title: titleInput.value.trim() || clip.title,
              hook: hookInput.value.trim(),
              pillar: pillarSelect.value,
              body: clip.transcript_text,
            });
            if (!result.id) { alert(result.error || 'Failed to send.'); return; }
            HypeAudio.updateClip(clip.id, { content_idea_sent: true });
            renderContentIdeas();
          } finally {
            sendBtn.disabled = false;
            sendBtn.textContent = prevLabel;
          }
        };
        row.appendChild(sendBtn);

        list.appendChild(row);
      });
    }

    function showSection(key, mentality) {
      if (typeof mediaRecorder !== 'undefined' && mediaRecorder && mediaRecorder.state === 'recording') cancelRecording();
      currentPillar = key;
      currentMentality = mentality;
      document.getElementById('view-home').style.display = 'none';
      document.getElementById('view-subcat').style.display = 'none';
      document.getElementById('view-section').style.display = '';
      document.getElementById('view-title-review').style.display = 'none';
      document.getElementById('view-content-ideas').style.display = 'none';
      document.getElementById('view-weekly-recap').style.display = 'none';
      renderSection(key, mentality);
      renderTabbar();
    }

    function renderSection(key, mentality) {
      const meta = PILLARS[key];
      document.getElementById('section-title').textContent = meta.label + ' · ' + mentalityLabel(mentality);
      document.getElementById('section-title').style.color = meta.color;
      document.getElementById('pillar-input').value = key;
      document.getElementById('mentality-input').value = mentality;
      document.getElementById('page-bg').style.backgroundImage = "url('" + mentalityArt(mentality) + "')";
      const recordDetails = document.getElementById('record-clip-details');
      if (recordDetails) recordDetails.style.display = key === 'carl' ? '' : 'none';

      const randomBtn = document.getElementById('random-play');
      const randomActive = HypeAudio.isPlayingRandomFilter({ pillar: key, mentality: mentality });
      randomBtn.textContent = randomActive ? '■ STOP' : meta.emoji + ' PLAY RANDOM';
      randomBtn.style.background = randomActive ? 'rgba(255,255,255,0.1)' : 'linear-gradient(135deg, ' + meta.color + ' 0%, ' + meta.color + ' 100%)';
      randomBtn.onclick = function () {
        if (HypeAudio.isPlayingRandomFilter({ pillar: key, mentality: mentality })) { HypeAudio.stopPlayback(); renderSection(key, mentality); return; }
        const clip = HypeAudio.playRandomLoop({ pillar: key, mentality: mentality });
        if (!clip) { alert('No ' + mentalityLabel(mentality) + ' clips yet — upload one below.'); return; }
        renderSection(key, mentality);
      };

      const favBtn2 = document.getElementById('favorites-play');
      const favActive = HypeAudio.isPlayingFavoritesWeighted({ pillar: key, mentality: mentality });
      favBtn2.textContent = favActive ? '■ STOP' : '⭐ FAVORITES';
      favBtn2.style.background = favActive ? 'rgba(255,255,255,0.1)' : 'linear-gradient(135deg, #FFC107 0%, #FFC107 100%)';
      favBtn2.onclick = function () {
        if (HypeAudio.isPlayingFavoritesWeighted({ pillar: key, mentality: mentality })) { HypeAudio.stopPlayback(); renderSection(key, mentality); return; }
        const clip = HypeAudio.playFavoritesWeightedLoop({ pillar: key, mentality: mentality });
        if (!clip) { alert('No favorited ' + mentalityLabel(mentality).toLowerCase() + ' clips yet — tap ☆ on a clip to favorite it.'); return; }
        renderSection(key, mentality);
      };

      const list = document.getElementById('clip-list');
      list.innerHTML = '';
      const clips = HypeAudio.listActiveClips().filter(function (c) { return c.pillar === key && c.mentality === mentality; });
      if (!clips.length) {
        list.innerHTML = '<div class="empty-state">No ' + mentalityLabel(mentality).toLowerCase() + ' clips yet — upload one above.</div>';
        return;
      }
      clips.forEach(function (clip) {
        const row = document.createElement('div');
        row.className = 'clip';
        const thumb = document.createElement('img');
        thumb.className = 'clip-thumb';
        thumb.alt = '';
        thumb.src = 'images/clips/' + (Object.hasOwn(CLIP_ART_MANIFEST, clip.mentality) ? CLIP_ART_MANIFEST[clip.mentality] : CLIP_ART_MANIFEST.default);
        const info = document.createElement('div');
        info.className = 'clip-info';
        const titleEl = document.createElement('div');
        titleEl.className = 'clip-title';
        titleEl.textContent = clip.title;
        const metaEl = document.createElement('div');
        metaEl.className = 'clip-meta';
        metaEl.textContent = clip.mentality + ' · ' + clip.moment;
        info.appendChild(titleEl);
        info.appendChild(metaEl);
        const preview = HypeAudio.quotePreview(clip, 80);
        if (preview) {
          const quoteEl = document.createElement('div');
          quoteEl.className = 'clip-quote';
          quoteEl.textContent = '"' + preview + '"';
          info.appendChild(quoteEl);
        }
        const actions = document.createElement('div');
        actions.className = 'clip-actions';
        const playBtn = document.createElement('button');
        playBtn.className = 'play-btn';
        playBtn.textContent = HypeAudio.isPlaying(clip.id) ? '⏸' : '▶';
        playBtn.onclick = function () {
          // Currently-loaded clip: plain pause/resume, keeps its place in the
          // list-descent. A different clip: start playing down the list from
          // here (cancels any random loop -- "or choose one myself").
          if (HypeAudio.isCurrent(clip.id)) { HypeAudio.togglePlay(clip); }
          else { HypeAudio.playFromList(clips, clip.id); }
          renderSection(key, mentality);
        };

        const favBtn = document.createElement('button');
        favBtn.className = 'play-btn' + (clip.favorite ? ' favorite-active' : '');
        favBtn.title = clip.favorite ? 'Remove favorite' : 'Mark favorite';
        favBtn.textContent = clip.favorite ? '⭐' : '☆';
        favBtn.onclick = function () {
          HypeAudio.updateClip(clip.id, { favorite: !clip.favorite });
          renderSection(key, mentality);
        };

        const repeatBtn = document.createElement('button');
        repeatBtn.className = 'play-btn' + (HypeAudio.isPlayingRepeat(clip.id) ? ' repeat-active' : '');
        repeatBtn.title = 'Repeat this clip';
        repeatBtn.textContent = HypeAudio.isPlayingRepeat(clip.id) ? '■' : '🔁';
        repeatBtn.onclick = function () {
          if (HypeAudio.isPlayingRepeat(clip.id)) { HypeAudio.stopPlayback(); }
          else { HypeAudio.playRepeat(clip); }
          renderSection(key, mentality);
        };

        const menuWrap = document.createElement('div');
        menuWrap.className = 'menu-wrap';
        const menuBtn = document.createElement('button');
        menuBtn.className = 'menu-btn';
        menuBtn.title = 'More';
        menuBtn.textContent = '⋮';
        const dropdown = document.createElement('div');
        dropdown.className = 'menu-dropdown';
        const cooldownItem = document.createElement('button');
        cooldownItem.className = 'menu-item menu-item-neutral';
        cooldownItem.textContent = HypeAudio.isOnCooldown(clip) ? 'Cancel cooldown' : 'Not now (1 day)';
        cooldownItem.onclick = function () {
          dropdown.classList.remove('open');
          HypeAudio.toggleDislikeCooldown(clip.id);
          renderSection(key, mentality);
        };
        const delItem = document.createElement('button');
        delItem.className = 'menu-item';
        delItem.textContent = 'Delete';
        delItem.onclick = function () {
          dropdown.classList.remove('open');
          if (!confirm('Delete "' + clip.title + '"? This can\'t be undone.')) return;
          HypeAudio.deleteClip(clip.id);
          renderSection(key, mentality);
        };
        dropdown.appendChild(cooldownItem);
        dropdown.appendChild(delItem);
        menuBtn.onclick = function (e) {
          e.stopPropagation();
          const isOpen = dropdown.classList.contains('open');
          closeAllMenus();
          if (!isOpen) { dropdown.classList.add('open'); menuBtn.classList.add('open'); }
        };
        menuWrap.appendChild(menuBtn);
        menuWrap.appendChild(dropdown);

        actions.appendChild(playBtn);
        actions.appendChild(favBtn);
        actions.appendChild(repeatBtn);
        actions.appendChild(menuWrap);
        row.appendChild(thumb);
        row.appendChild(info);
        row.appendChild(actions);
        list.appendChild(row);
      });
    }

    document.getElementById('back-btn').onclick = function () { showSubcats(currentPillar); };
    document.getElementById('subcat-back-btn').onclick = function () { showHome(); };
    document.getElementById('title-review-back-btn').onclick = function () { showHome(); };
    document.getElementById('content-ideas-back-btn').onclick = function () { showHome(); };

    function closeAllMenus() {
      document.querySelectorAll('.menu-dropdown.open').forEach(function (d) { d.classList.remove('open'); });
      document.querySelectorAll('.menu-btn.open').forEach(function (b) { b.classList.remove('open'); });
    }
    document.addEventListener('click', closeAllMenus);

    // Persistent now-playing bar above the tab bar -- playback state used to
    // be invisible (and unstoppable) from any screen other than the exact
    // one whose button started it.
    // Item 13: the explainer line + thumbs never touch currentAudio -- they
    // only read getCurrentClip()/getPlaybackContext() and, on a tap, call
    // submitQueueFeedback (which is itself wrapped and fails safe). A
    // throwing explainQueuePick call (shouldn't happen, but this is the
    // "must never interrupt playback" guarantee) still can't break the
    // title/toggle/stop row above it.
    function renderNowPlaying() {
      const bar = document.getElementById('nowplaying');
      const clip = HypeAudio.getCurrentClip();
      if (!clip) { bar.style.display = 'none'; return; }
      bar.style.display = 'flex';
      document.getElementById('nowplaying-title').textContent = clip.title || 'Untitled';
      document.getElementById('nowplaying-toggle').textContent = HypeAudio.isPlaying(clip.id) ? '⏸' : '▶';
      let explanation = '';
      try { explanation = HypeAudio.explainQueuePick(clip, HypeAudio.getPlaybackContext()) || ''; } catch (e) {}
      document.getElementById('nowplaying-explain-text').textContent = explanation;
      document.getElementById('nowplaying-thumbs-up').classList.toggle('active', !!clip.favorite);
      document.getElementById('nowplaying-thumbs-down').classList.toggle('active', HypeAudio.isOnCooldown(clip));
    }
    document.getElementById('nowplaying-toggle').onclick = function () {
      const clip = HypeAudio.getCurrentClip();
      if (clip) HypeAudio.togglePlay(clip);
    };
    document.getElementById('nowplaying-stop').onclick = function () { HypeAudio.stopPlayback(); };
    document.getElementById('nowplaying-thumbs-up').onclick = function () {
      const clip = HypeAudio.getCurrentClip();
      if (clip) { HypeAudio.submitQueueFeedback(clip.id, 'up'); renderNowPlaying(); }
    };
    document.getElementById('nowplaying-thumbs-down').onclick = function () {
      const clip = HypeAudio.getCurrentClip();
      if (clip) { HypeAudio.submitQueueFeedback(clip.id, 'down'); renderNowPlaying(); }
    };

    // Keep whichever row is actually playing in sync (icon flips to ▶ again
    // once a clip ends, without polling).
    HypeAudio.onPlaybackChange(function () {
      renderNowPlaying();
      if (currentMentality) renderSection(currentPillar, currentMentality);
      else if (currentPillar) renderSubcats(currentPillar);
      else renderHome();
    });

    // Shared by both upload forms (clip-list screen has a fixed mentality;
    // subcat screen lets you type a brand-new one that has no tile yet).
    async function submitClip(form, pillar, mentality, moment, source, fileInput, titleInput) {
      const file = fileInput.files[0];
      // Normalized to lowercase -- mentality is the grouping key for subcat
      // tiles and random filters, so "Goggins" and "goggins" would otherwise
      // become two separate subcategories.
      mentality = (mentality || '').trim().toLowerCase();
      const title = (titleInput.value || '').trim();
      if (!mentality || !title) { alert('Title and mentality are both required.'); return; }
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true; // also the double-submit guard
      const prevLabel = submitBtn.textContent;
      submitBtn.textContent = 'Uploading…';
      try {
        const { url, error } = await HypeAudio.uploadClipFile(file);
        if (!url) { alert(error || 'Upload failed.'); return; }
        HypeAudio.addClip({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
          title: title,
          mentality: mentality,
          pillar: pillar,
          moment: moment,
          source_type: source,
          storage_url: url,
          created_at: new Date().toISOString(),
          play_count: 0,
        });
        form.reset();
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = prevLabel;
      }
    }

    document.getElementById('upload-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      await submitClip(
        e.target, currentPillar, currentMentality,
        document.getElementById('moment-input').value,
        document.getElementById('source-input').value,
        document.getElementById('file-input'),
        document.getElementById('title-input')
      );
      document.getElementById('pillar-input').value = currentPillar;
      document.getElementById('mentality-input').value = currentMentality;
      renderSection(currentPillar, currentMentality);
    });

    document.getElementById('sc-upload-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const mentality = document.getElementById('sc-mentality-input').value;
      await submitClip(
        e.target, currentPillar, mentality,
        document.getElementById('sc-moment-input').value,
        document.getElementById('sc-source-input').value,
        document.getElementById('sc-file-input'),
        document.getElementById('sc-title-input')
      );
      renderSubcats(currentPillar);
    });

    // One-time-in-effect migrations (mentality casing normalized first, since
    // the pillar migrations below key off it; Goggins -> Mindset, Carl's-own-
    // voice -> Carl) — idempotent, safe to run on every load.
    HypeAudio.migrateMentalityCasing();
    HypeAudio.migrateGogginsToMindset();
    HypeAudio.migrateCarlToOwnPillar();

    // record-your-own: hide the whole block if this browser/context can't
    // actually record (MediaRecorder can exist as a constructor while mic
    // capture itself is unavailable, e.g. some restricted WebViews).
    if (typeof MediaRecorder === 'undefined' || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      document.getElementById('record-clip-details').remove();
    } else {
      // Prefer a codec Safari actually supports; audio/webm is not reliable on iOS.
      const RECORD_MIME_CANDIDATES = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'];
      var pickRecordMimeType = function () {
        for (const t of RECORD_MIME_CANDIDATES) {
          if (typeof MediaRecorder.isTypeSupported === 'function' && MediaRecorder.isTypeSupported(t)) return t;
        }
        return ''; // let the browser pick its own default rather than force an unsupported type
      };

      var mediaRecorder = null;
      var recordedChunks = [];
      var recordedBlob = null;
      var recordedUrl = null;
      var recordElapsedInterval = null;
      var recordStartedAt = 0;
      var activeStream = null;

      var startRecording = async function () {
        const startBtn = document.getElementById('record-start-btn');
        // Disabled synchronously (not after the getUserMedia await) so a
        // rapid double-tap can't fire two overlapping recordings -- the
        // permission prompt is exactly the window a second tap could land in.
        startBtn.disabled = true;
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) {
          alert('Microphone access denied — enable it in your browser/device settings to record a clip.');
          startBtn.disabled = false;
          return;
        }
        activeStream = stream;
        recordedChunks = [];
        try {
          const mimeType = pickRecordMimeType();
          mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType: mimeType }) : new MediaRecorder(stream);
          mediaRecorder.ondataavailable = function (e) { if (e.data.size > 0) recordedChunks.push(e.data); };
          mediaRecorder.onerror = function () {
            cancelRecording();
            alert('Recording failed — try again.');
          };
          mediaRecorder.onstop = function () {
            stream.getTracks().forEach(function (t) { t.stop(); });
            activeStream = null;
            startBtn.disabled = false;
            if (!recordedChunks.length) return; // stopped via cancelRecording, not a real stop-to-preview
            recordedBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || mimeType || 'audio/webm' });
            recordedUrl = URL.createObjectURL(recordedBlob);
            showRecordPreview();
          };
          mediaRecorder.start();
        } catch (e) {
          // Some browsers can throw constructing/starting MediaRecorder even
          // after isTypeSupported() passed -- without this, the mic stream
          // would keep running with nothing left able to stop it.
          stream.getTracks().forEach(function (t) { t.stop(); });
          activeStream = null;
          startBtn.disabled = false;
          alert('Recording failed to start — try again.');
          return;
        }
        recordStartedAt = Date.now();
        document.getElementById('record-idle').style.display = 'none';
        document.getElementById('record-active').style.display = 'flex';
        recordElapsedInterval = setInterval(updateRecordElapsed, 250);
      };

      var updateRecordElapsed = function () {
        const secs = Math.floor((Date.now() - recordStartedAt) / 1000);
        const mins = Math.floor(secs / 60);
        document.getElementById('record-elapsed').textContent = mins + ':' + String(secs % 60).padStart(2, '0');
      };

      var stopRecording = function () {
        clearInterval(recordElapsedInterval);
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      };

      // Hard-stops and discards without producing a preview -- used when
      // navigating away mid-recording or on a recorder error. Clearing
      // recordedChunks first means onstop's own guard skips showRecordPreview().
      var cancelRecording = function () {
        clearInterval(recordElapsedInterval);
        recordedChunks = [];
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        else if (activeStream) { activeStream.getTracks().forEach(function (t) { t.stop(); }); activeStream = null; }
        document.getElementById('record-active').style.display = 'none';
        document.getElementById('record-idle').style.display = '';
      };

      var showRecordPreview = function () {
        document.getElementById('record-active').style.display = 'none';
        document.getElementById('record-preview').style.display = 'flex';
        document.getElementById('record-save-form').style.display = 'flex';
        document.getElementById('record-preview-audio').src = recordedUrl;
      };

      var resetRecordUi = function () {
        if (recordedUrl) URL.revokeObjectURL(recordedUrl);
        recordedBlob = null;
        recordedUrl = null;
        document.getElementById('record-preview').style.display = 'none';
        document.getElementById('record-save-form').style.display = 'none';
        document.getElementById('record-idle').style.display = '';
        document.getElementById('record-save-form').reset();
      };

      document.getElementById('record-start-btn').onclick = startRecording;
      document.getElementById('record-stop-btn').onclick = stopRecording;
      document.getElementById('record-rerecord-btn').onclick = resetRecordUi;

      document.getElementById('record-save-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const saveBtn = e.target.querySelector('button[type="submit"]');
        saveBtn.disabled = true; // guards against a double-tap firing two uploads for one recording
        try {
          // recordedBlob.type can come back empty or unusual on some browsers --
          // fall back to 'webm' rather than let split('/') produce a bad filename.
          const parts = (recordedBlob.type || '').split('/');
          const ext = (parts[1] || 'webm').split(';')[0] || 'webm';
          const file = new File([recordedBlob], 'recording_' + Date.now() + '.' + ext, { type: recordedBlob.type || 'audio/webm' });
          const { url, error } = await HypeAudio.uploadClipFile(file);
          if (!url) { alert(error || 'Upload failed.'); return; }
          HypeAudio.addClip({
            id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
            title: document.getElementById('record-title-input').value.trim(),
            mentality: document.getElementById('record-mentality-input').value.trim().toLowerCase(),
            pillar: 'carl',
            moment: document.getElementById('record-moment-input').value,
            source_type: document.getElementById('record-source-input').value,
            storage_url: url,
            created_at: new Date().toISOString(),
            play_count: 0,
          });
          resetRecordUi();
          renderSection(currentPillar, currentMentality);
        } finally {
          saveBtn.disabled = false;
        }
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    document.getElementById('global-search-input').addEventListener('input', function (e) {
      const query = e.target.value;
      const resultsEl = document.getElementById('global-search-results');
      const tilesEl = document.getElementById('tiles');
      const momentRowEl = document.getElementById('moment-row');
      if (!query.trim()) {
        resultsEl.style.display = 'none';
        tilesEl.style.display = '';
        momentRowEl.style.display = '';
        return;
      }
      const results = window.HypeAudio.searchClips(query);
      tilesEl.style.display = 'none';
      momentRowEl.style.display = 'none';
      resultsEl.style.display = '';
      resultsEl.innerHTML = results.length
        ? results.map(function (c) {
            const preview = window.HypeAudio.quotePreview(c, 100);
            return '<div class="clip search-result" data-clip-id="' + c.id + '">' +
              '<div class="clip-info">' +
                '<div class="clip-title">' + escapeHtml(c.title) + '</div>' +
                '<div class="clip-meta">' + escapeHtml(c.pillar) + ' · ' + escapeHtml(c.mentality) + '</div>' +
                (preview ? '<div class="clip-quote">' + escapeHtml(preview) + '</div>' : '') +
              '</div>' +
            '</div>';
          }).join('')
        : '<div class="empty-state">No matches</div>';
      resultsEl.querySelectorAll('.search-result').forEach(function (row) {
        row.onclick = function () {
          const clip = results.find(function (c) { return c.id === row.dataset.clipId; });
          // A pillar-less/mentality-less legacy clip (this app has always
          // supported that shape -- see hype-audio.selfcheck.js's own
          // "unmigrated legacy shape" test) would crash showSection().
          if (clip && clip.pillar && clip.mentality) showSection(clip.pillar, clip.mentality);
        };
      });
    });

    showHome();
  </script>
</body>
</html>
